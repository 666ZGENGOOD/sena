<form action="https://formsubmit.co/andresramirezconde799@gmail.com" method="POST">
    
    <input type="hidden" name="_next" value="https://www.google.com">

    <div class="form-grid">
        
        <div class="form-group full-width">
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Eduardo Martínez" required>
        </div>

        <div class="form-group">
            <label for="tipo_doc">Tipo de Documento *</label>
            <select id="tipo_doc" name="tipo_doc" required>
                <option value="">Seleccione...</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="CE">Cédula de Extranjería</option>
            </select>
        </div>

        <div class="form-group">
            <label for="numero">Número de Documento *</label>
            <input type="number" id="numero" name="numero" placeholder="Ej. 1102938475" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo Electrónico *</label>
            <input type="email" id="correo" name="correo" placeholder="usuario@correo.com" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono / Celular *</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 3001234567" required>
        </div>

        <div class="form-group text-full-width">
            <label for="centro">Regional o Centro de Formación</label>
            <input type="text" id="centro" name="centro" placeholder="Ej. Centro de Electricidad y Automatización Industrial">
        </div>

        <div class="form-group full-width">
            <label for="satisfaccion">¿Cómo califica la actividad realizada? *</label>
            <select id="satisfaccion" name="satisfaccion" required>
                <option value="">Seleccione una opción...</option>
                <option value="excelente">Excelente - Cumplió todas las expectativas</option>
                <option value="bueno">Bueno - Aceptable</option>
                <option value="regular">Regular - Puede mejorar</option>
            </select>
        </div>

        <button type="submit" class="btn-submit full-width">Continuar Encuesta</button>
        
    </div>
</form>
